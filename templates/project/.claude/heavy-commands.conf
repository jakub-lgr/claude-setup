# Heavy command guard (hooks/guard-heavy-commands.sh).
# The first "wrapper=" line names the wrapper every heavy command must go through.
wrapper=my-heavy-wrapper

# Extended regexes of commands that count as heavy, one per line.
# Example for a JavaScript project, replace with your project's commands.
\b(pnpm|npm|yarn) (run )?(build|check|test|typecheck)\b
\bvitest\b
\bturbo run\b
\bnext build\b
\bplaywright test\b
