# Heavy command guard (hooks/guard-heavy-commands.sh).
# First line: the wrapper every heavy command must go through.
wrapper=my-heavy-wrapper

# Extended regexes of commands that count as heavy.
\b(pnpm|npm|yarn) (run )?(build|check|test|typecheck)\b
\bvitest\b
\bturbo run\b
\bnext build\b
\bplaywright test\b
